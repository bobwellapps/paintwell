[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paintwell"
version = "1.3"
description = "A friendly, capable image editor for Linux, with a familiar-style layout."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "bobwellapps" }]
dependencies = [
    "PySide6-Essentials==6.12.0",
    "numpy>=1.26",
]

[project.gui-scripts]
paintwell = "paintwell.__main__:main"

[tool.setuptools]
packages = ["paintwell"]

[tool.setuptools.package-data]
paintwell = ["resources/*.png"]
